[package]
name = "fpv"
version = "0.1.11"
edition = "2021"
description = "A minimal, keyboard-first TUI file previewer with syntax highlighting"
authors = ["Digicrafts"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/digicrafts/fpv"
homepage = "https://github.com/digicrafts/fpv"
documentation = "https://docs.rs/fpv"
keywords = ["tui", "terminal", "preview", "cli", "rust"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
anyhow = "1"
base64 = "0.22"
crossterm = "0.29"
git2 = { version = "0.19", default-features = false }
ignore = "0.4"
image = { version = "0.25.5", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "pnm", "tga", "tiff", "webp"] }
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
regex = "1.10"
toml = "0.8"
unicode-width = "0.1"
time = "0.3"
globset = "0.4"
indexmap = "2"
tree-sitter = "0.20"
tree-sitter-javascript = "0.20"
tree-sitter-python = "0.20"
tree-sitter-rust = "0.20"
tree-sitter-typescript = "0.20"
tree-sitter-highlight = "0.20"
tree-sitter-html = "0.19"
tree-sitter-json = "0.20"
tree-sitter-yaml = "0.0"
tree-sitter-go = "0.20"
tree-sitter-c = "0.20"
tree-sitter-cpp = "0.20"
tree-sitter-java = "0.20"
tree-sitter-bash = "0.20"
tree-sitter-css = "0.20"
tree-sitter-toml = "0.20"
tree-sitter-md = "0.1"
jpeg-decoder = "0.3.2"
turbojpeg = { version = "1.4.0", default-features = false, features = ["cmake"], optional = true }

[features]
default = []
turbojpeg-fastpath = ["dep:turbojpeg"]

[package.metadata.deb]
copyright = "MIT"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[build]
incremental = true
rustflags = ["-C", "codegen-units=4"]
rustc-wrapper = "sccache"
